[project]
name = "getbijiex"
version = "0.1.0"
description = "Export Get笔记 (biji.com) knowledge-base subscriptions to Markdown and JSON"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "DrissionPage>=4.1.1.2",
    "feapder>=1.9.3",
    "mongita>=1.2.0",
    "requests>=2.32.5",
    "weasyprint>=62.0",
    "markdown>=3.5",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.16.0",
    "pytest>=8.0.0",
]
